[project]
name = "rheo-app-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# The operator command talks to the control plane and the workspace databases
# through the core packages: the registry, the boundary factories, provisioning
# and the migration orchestrator. rheo-contracts arrives through rheo-core.
dependencies = ["rheo-core"]

[project.scripts]
rheo = "rheo_app_cli.main:main"

[tool.uv.sources]
rheo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_app_cli"]

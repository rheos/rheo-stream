# Weekly dependency updates, grouped so a routine week is one PR per ecosystem
# rather than one per package. Major bumps stay ungrouped on purpose: those are
# the ones that deserve to be read individually.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # ESLint 10 breaks eslint-config-next's @rushstack/eslint-patch, which
      # recognises a fixed set of ESLint internals (PR #28). Drop this once
      # eslint-config-next supports v10. Minor and patch still flow.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # vite and vitest have to move as a unit: vitest majors import Vite
      # subpaths that older Vite does not export, so bumped apart they produce
      # a pair that cannot resolve (PR #29). Listed first, and excluded from
      # the catch-all below, so neither group can claim them by accident.
      vite-toolchain:
        patterns: ["vite", "vitest", "@vitest/*"]
      javascript-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["vite", "vitest", "@vitest/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

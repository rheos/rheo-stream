# Local dev stack, extended in run 0b1: a Postgres with pgvector + pg_trgm
# available, and the `core` image, which now makes a real database call at
# startup (rheo_app_core.startup.run_startup, from the FastAPI lifespan) — the
# control-chain migration and per-workspace migrations. No `web` service — 0a
# runs the web shell under `next start` outside compose (spec.md W1); `make demo`
# orchestrates that. Credentials here are dev-only, non-secret placeholders —
# this is a local compose file, not a secret-store entry (that seam is 0b / A4).
name: rheo-stream

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rheo
      POSTGRES_PASSWORD: rheo_dev_only
      POSTGRES_DB: rheo
    # Host port is parameterised so a developer whose 5432 is already bound by an
    # unrelated project can run this stack without touching that container. The
    # default is the literal previous value, so a fresh clone is unchanged.
    ports:
      - "${RHEO_PG_PORT:-5432}:5432"
    # Data on a named Docker volume, never a bind mount into the repo, so
    # `make up`/`make demo` write nothing into the tracked tree (criterion 2).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rheo -d rheo"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    # `compose.yaml` lives in deploy/, so the build context is the parent
    # directory — the checkout root — where the Dockerfile and root manifests
    # live (spec.md Technical Risks, risk 4).
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # `core` now makes a real database call in its lifespan (the control-chain
    # migration), so it must wait for postgres to be accepting connections, not
    # merely for the container to have started.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Compose-network DSN: `postgres` is the service's DNS name on the compose
      # network, always port 5432 there regardless of the host-side RHEO_PG_PORT
      # remap (that remap is host-port-only; nothing on the compose network reads
      # RHEO_PG_PORT).
      RHEO_CLUSTER_DSN: postgresql://rheo:rheo_dev_only@postgres:5432/postgres
      RHEO_DATA_ROOT: /var/lib/rheo-stream
      RHEO_IN_CONTAINER: "1"
      RHEO_PROFILE: development
    volumes:
      # Named volume, never a bind mount into the repo, so `make up`/`make demo`
      # write nothing into the tracked tree (criterion 2) — same rule as pgdata.
      - rheodata:/var/lib/rheo-stream

volumes:
  pgdata:
  rheodata:

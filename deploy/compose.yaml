# Local dev stack for run 0a: a Postgres with pgvector + pg_trgm available, and
# the hello-world `core` image. No `web` service — 0a runs the web shell under
# `next start` outside compose (spec.md W1); `make demo` orchestrates that.
# Credentials here are dev-only, non-secret placeholders — this is a local compose
# file, not a secret-store entry (that seam is 0b / A4).
name: rheo-stream

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rheo
      POSTGRES_PASSWORD: rheo_dev_only
      POSTGRES_DB: rheo
    # Host port is parameterised so a developer whose 5432 is already bound by an
    # unrelated project can run this stack without touching that container. The
    # default is the literal previous value, so a fresh clone is unchanged.
    ports:
      - "${RHEO_PG_PORT:-5432}:5432"
    # Data on a named Docker volume, never a bind mount into the repo, so
    # `make up`/`make demo` write nothing into the tracked tree (criterion 2).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rheo -d rheo"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    # `compose.yaml` lives in deploy/, so the build context is the parent
    # directory — the checkout root — where the Dockerfile and root manifests
    # live (spec.md Technical Risks, risk 4).
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # No `depends_on: postgres` — `core` makes no database connection in 0a
    # (spec.md System Components), so there is no DB call to order against.

volumes:
  pgdata:
